# Production Portainer stack "twitch-discord-bot" (stack 1, endpoint 2).
# Secrets live only in the stack env in Portainer, never in this file.
# Image is built by .github/workflows/build.yml; portainer-deployer pulls :latest
# and redeploys this stack with the same compose and env.
services:
  twitch-discord-bot:
    image: ghcr.io/lordboos/twitchdiscordbot:latest
    container_name: twitch-discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_CHAT_BOT_LOGIN=${TWITCH_CHAT_BOT_LOGIN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_PORT=8081
      - KICK_CLIENT_ID=${KICK_CLIENT_ID:-}
      - KICK_CLIENT_SECRET=${KICK_CLIENT_SECRET:-}
      - KICK_REDIRECT_URI=${KICK_REDIRECT_URI:-}
      - KICK_NOTIFICATION_COOLDOWN_SECONDS=${KICK_NOTIFICATION_COOLDOWN_SECONDS:-300}
      - DATABASE_PATH=./data/bot.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NOTIFICATION_COOLDOWN_SECONDS=${NOTIFICATION_COOLDOWN_SECONDS:-30}
    ports:
      - "8081:8081"
    volumes:
      - twitch-bot-data:/app/data
      - twitch-bot-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - twitch-bot-network

volumes:
  twitch-bot-data:
    driver: local
  twitch-bot-logs:
    driver: local

networks:
  twitch-bot-network:
    driver: bridge
